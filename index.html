<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift for My Bestie</title>
    <!-- Beautiful cursive font for the letter -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* --- STAGE 1: CLAIM BUTTON --- */
        #claim-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            animation: pulse 1.5s infinite;
        }
        #claim-btn:hover {
            background: #ff758f;
            transform: scale(1.05);
        }

        /* --- STAGE 2: GIFT BOX --- */
        .gift-container {
            display: none;
            position: relative;
            cursor: pointer;
            margin: 50px auto;
            width: 160px;
            height: 160px;
        }
        .gift-box {
            background: #ff4d6d;
            width: 150px;
            height: 150px;
            position: absolute;
            bottom: 0;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        /* Ribbon horizontal */
        .gift-box::before {
            content: '';
            position: absolute;
            background: #fff0f3;
            width: 100%;
            height: 30px;
            top: 60px;
            left: 0;
        }
        /* Ribbon vertical */
        .gift-box::after {
            content: '';
            position: absolute;
            background: #fff0f3;
            width: 30px;
            height: 100%;
            left: 60px;
            top: 0;
        }
        .gift-lid {
            background: #ff758f;
            width: 160px;
            height: 40px;
            position: absolute;
            top: -10px;
            left: -5px;
            border-radius: 5px;
            z-index: 2;
            transition: transform 0.8s ease-in-out;
        }
        /* Lid ribbon vertical */
        .gift-lid::after {
            content: '';
            position: absolute;
            background: #fff0f3;
            width: 30px;
            height: 100%;
            left: 65px;
        }
        /* Click instructions instruction */
        .hint-text {
            display: none;
            color: #ff4d6d;
            font-weight: 600;
            margin-top: 15px;
            animation: bounce 2s infinite;
        }

        /* Open animation state */
        .gift-container.open .gift-lid {
            transform: translateY(-80px) rotate(-20px);
            opacity: 0;
        }

        /* --- STAGE 3: THE LETTER --- */
        .letter-card {
            display: none;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 2px dashed #ffc2d1;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s ease-out;
            position: relative;
        }
        .letter-card.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
        .letter-text {
            font-family: 'Caveat', cursive;
            font-size: 1.7rem;
            color: #4a4a4a;
            line-height: 1.5;
            text-align: left;
        }
        .letter-text p {
            margin-bottom: 15px;
        }
        .signature {
            text-align: right;
            margin-top: 25px;
            font-size: 2rem;
            color: #ff4d6d;
        }
        
        /* Sparkle Hearts Decoration */
        .heart-deco {
            color: #ff4d6d;
            font-size: 1.5rem;
            position: absolute;
            top: -15px;
            right: 20px;
            animation: float 2s infinite ease-in-out;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Step 1: The Claim Button -->
        <button id="claim-btn" onclick="revealGift()">Claim My Gift 🎁</button>

        <!-- Step 2: The Interactive Gift Box -->
        <div id="gift-area" class="gift-container" onclick="openGift()">
            <div class="gift-lid"></div>
            <div class="gift-box"></div>
        </div>
        <p id="hint" class="hint-text">Tap the box to open it! ✨</p>

        <!-- Step 3: The Custom Letter -->
        <div id="letter" class="letter-card">
            <span class="heart-deco">💖✨</span>
            <div class="letter-text">
                <p>Dear bestie,</p>
                <p>You entered my life and it brightened up. In every world, every life I would still choose you as my bestie.</p>
                <p>I can’t write here everything… it would be a book. So you’re not just my friend, you are a blessing.</p>
                <div class="signature">- Shreyas</div>
            </div>
        </div>
    </div>

    <script>
        function revealGift() {
            // Hide claim button
            document.getElementById('claim-btn').style.display = 'none';
            // Show gift box and instructions
            document.getElementById('gift-area').style.display = 'block';
            document.getElementById('hint').style.display = 'block';
        }

        function openGift() {
            var giftContainer = document.getElementById('gift-area');
            var hint = document.getElementById('hint');
            var letter = document.getElementById('letter');
            
            // Trigger box open animation
            giftContainer.classList.add('open');
            hint.style.display = 'none';
            
            // Smoothly display the handwritten letter after box lid flies off
            setTimeout(function() {
                giftContainer.style.display = 'none';
                letter.classList.add('show');
            }, 600);
        }
    </script>

</body>
</html>
